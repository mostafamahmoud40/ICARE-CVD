# ICARE-CVD ML Services — single `docker compose up` brings up all services:
#   ml-main     :8000  CT segmentation + Chest X-ray   (GPU)
#   ml-ecg      :5050  ECG arrhythmia + clinical report (GPU)
#   ml-echo     :8080  Echocardiogram EF analyzer       (GPU)
#   ml-medical  :5000  Lab report OCR + LLM analyzer    (CPU, cloud-only)
#   ml-ecg-rag  :8502  ECG feature extraction + RAG LLM (GPU embeddings + cloud LLM)
#   ml-ecg-cls  :8503  ECG image classifier MaxViT 98% (GPU)
#   ml-mri      :8090  Cardiac Cine-MRI diagnosis       (GPU)
#
# Secrets live in `.env` (next to this file). Copy `.env.example` first.
# Model weights are bind-mounted from the host so they can be swapped without
# rebuilding any image.

# NOTE: GPU reservation is inlined per-service below. The previous
# `x-gpu: &gpu` + `<<: *gpu` YAML merge anchor caused Docker Compose to
# silently drop the `published` field of `ports:` (host port mapping went
# missing). YAML 1.1 merge keys are not reliably supported in modern Compose.

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3

services:

  # ─── CT segmentation + Chest X-ray (FastAPI :8000, GPU) ────────────────────
  ml-main:
    build:
      context: .
      dockerfile: Dockerfile.main
    image: icare-ml-main:latest
    container_name: icare-ml-main
    gpus: all
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - MODEL_PATH=/service/app/CT/coronary_segmentation_model.pth
      - XRAY_MODEL_PATH=/service/app/xray/yolo12s.pt
    volumes:
      # Bind-mount CT folder — swap the .pth without rebuilding
      - ./app/CT:/service/app/CT:ro
      # YOLO12s chest X-ray weights
      - ./app/xray/yolo12s.pt:/service/app/xray/yolo12s.pt:ro
      # Shared torch cache for any lazy model downloads/checkpoints
      - torch-cache:/root/.cache/torch
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      start_period: 90s

  # ─── ECG arrhythmia classifier (Flask :5050, GPU) ──────────────────────────
  ml-ecg:
    build:
      context: .
      dockerfile: Dockerfile.ecg
    image: icare-ml-ecg:latest
    container_name: icare-ml-ecg
    gpus: all
    ports:
      - "5050:5050"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      # Bind-mount the ECG checkpoint at the path expected by app.py
      - ./app/ecg/ecgtransform_mit_best.pt:/service/ecgtransform_mit_best.pt:ro
      - torch-cache:/root/.cache/torch
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/health')"]
      start_period: 30s

  # ─── Echocardiogram EF analyzer (FastAPI :8080, GPU) ───────────────────────
  ml-echo:
    build:
      context: .
      dockerfile: Dockerfile.echo
    image: icare-ml-echo:latest
    container_name: icare-ml-echo
    gpus: all
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      # Bind-mount both echo model files at the paths expected by config.py
      - ./app/echo-dynamic/deeplabv3_resnet50_random.pt:/service/deeplabv3_resnet50_random.pt:ro
      - ./app/echo-dynamic/r2plus1d_18_32_2_pretrained.pt:/service/r2plus1d_18_32_2_pretrained.pt:ro
      - torch-cache:/root/.cache/torch
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      start_period: 90s

  # ─── Cardiac Cine-MRI diagnosis service (FastAPI :8090, GPU) ───────────────
  ml-mri:
    build:
      context: .
      dockerfile: Dockerfile.mri
    image: icare-ml-mri:latest
    container_name: icare-ml-mri
    gpus: all
    ports:
      - "8090:8090"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./app/cardiac-mri/models/fct.model:/service/models/fct.model:ro
      - ./app/cardiac-mri/models/vautoencoder.model:/service/models/vautoencoder.model:ro
      - ./app/cardiac-mri/models/classifier.pkl:/service/models/classifier.pkl:ro
      - torch-cache:/root/.cache/torch
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      start_period: 120s

  # ─── Medical lab report analyzer (Flask :5000, CPU, cloud-only) ────────────
  ml-medical:
    build:
      context: .
      dockerfile: Dockerfile.medical
    image: icare-ml-medical:latest
    container_name: icare-ml-medical
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      start_period: 15s

  # ─── ECG diagnosis with LLM + RAG (FastAPI :8502, GPU embeddings + cloud LLM) ─
  ml-ecg-rag:
    build:
      context: .
      dockerfile: Dockerfile.ecg
    image: icare-ml-ecg:latest
    container_name: icare-ml-ecg-rag
    gpus: all
    command: ["sh", "-c", "cd /service/ecg_rag && uvicorn api:app --host 0.0.0.0 --port 8502 --workers 1"]
    ports:
      - "8502:8502"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - torch-cache:/root/.cache/torch
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8502/health')"]
      start_period: 45s

  # ─── ECG image classification MaxViT (FastAPI :8503, GPU) ───────────────────
  ml-ecg-classification:
    build:
      context: .
      dockerfile: Dockerfile.ecg-classification
    image: icare-ml-ecg-classification:latest
    container_name: icare-ml-ecg-classification
    gpus: all
    ports:
      - "8503:8503"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - ECG_CLASSIFICATION_MODEL_PATH=/service/models/maxvit_ecg_98.pth
    volumes:
      - ./app/Ecg_Classification/best_maxvit_ecg_model 98.pth:/service/models/maxvit_ecg_98.pth:ro
      - torch-cache:/root/.cache/torch
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8503/health')"]
      start_period: 120s

volumes:
  torch-cache:
  huggingface-cache:
